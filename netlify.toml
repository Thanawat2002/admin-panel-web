# Netlify detects Next.js and uses its Next.js runtime automatically
# (including rewrites to the external API).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
[[redirects]]
  from = "/api/*"
  to = "https://185.84.160.183/api/:splat"
  status = 200
  force = true